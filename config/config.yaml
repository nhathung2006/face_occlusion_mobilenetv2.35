model:
  name: mobilenetv2
  width_mult: 0.35
  num_classes: 1
  dropout: 0.2
  pretrained: true
  pretrained_path: weights/mobilenetv2_0.35-b2e15951.pth
  freeze_backbone_epochs: 0

data:
  root: "C:/Thực tập LUMI/model_BaiToan/Deepleaning/Face/face_occlusion_mobilenetv2/face_occlusion_mobilenetv2/dataset"
  image_size: 112
  batch_size: 64
  num_workers: 2
  pin_memory: true
  class_names:
    - clear
    - occluded

training:
  epochs: 110
  seed: 42
  optimizer: sgd
  momentum: 0.90
  nesterov: true
  weight_decay: 0.0003

  two_stage:
    enabled: true
    stage1_epochs: 8              # Giai đoạn 1: Epoch 1 -> 8 (chỉ train Classifier)
    stage1_lr: 0.008              # LR Giai đoạn 1 (5e-3)
    unfreeze_from_block: 7       # Giai đoạn 2: Khóa block 0 -> 6, mở từ block 7 trở đi
    warmup_epochs: 3              # Warmup đầu Giai đoạn 2
    warmup_start_factor: 0.1      # Bắt đầu từ 10% LR mục tiêu
    stage2_backbone_lr: 0.0004    # LR nhóm Block 7+ & Conv 1x1
    stage2_classifier_lr: 0.004   # LR nhóm Classifier (gấp 10 lần Backbone LR)

  scheduler: plateau_to_cosine    # 'plateau_to_cosine' (Plateau đến Epoch 50, từ Epoch 50 chuyển sang Cosine)
  plateau_to_cosine:
    switch_epoch: 50              # Chuyển sang Cosine Annealing tại Epoch 50
  plateau:
    monitor: val_loss             # Theo dõi validation loss
    mode: min                     # Giảm khi loss không giảm
    factor: 0.50                  # Giảm 50% LR nếu không cải thiện
    patience: 8                   # Giảm LR nếu val_loss chững lại sau 8 epoch
    min_lr: 0.000001              # Tốc độ học nhỏ nhất (1e-6)
    threshold: 0.0005             # Ngưỡng cải thiện tối thiểu
    cooldown: 1                   # Số epoch chờ trước khi bắt đầu đếm patience mới

  cosine:
    eta_min: 0.000001             # Tốc độ học nhỏ nhất (1e-6) khi dùng cosine

  loss_type: bce                   # BCEWithLogitsLoss nhận raw logits; sigmoid nằm bên trong loss
  focal:
    gamma: 1.0                    # Hệ số focusing (gamma = 1.0)
    alpha: 0.0                    # 0.0 (unweighted alpha)

  pos_weight: 1.0                 # Trọng số cho positive class (occluded), 1.0 = cân bằng
  label_smoothing: 0.00           # Tự động thay thế bằng target_smoothing nếu target_smoothing bật

  target_smoothing:
    enabled: true                 # Bật làm mềm nhãn sang [0.02, 0.98] để kẹp khoảng xác suất Sigmoid
    target_low: 0.02              # Nhãn Clear = 0.02 (Logit tối ưu ≈ -3.89)
    target_high: 0.98             # Nhãn Occluded = 0.98 (Logit tối ưu ≈ +3.89)

  logit_penalty:
    enabled: true                 # Bật hàm phạt biên độ logit (chống nổ logit, tối ưu hóa Quantize INT8)
    max_logit: 3.8918203           # logit(0.98), tương ứng sigmoid trong khoảng [0.02, 0.98]
    margin_weight: 0.05           # Phạt khi logit vượt quá +/- 3.90 (Relu(|logit| - 3.9)^2)
    l2_weight: 0.0                # Tắt L2 để không kéo logits về 0 (sigmoid=0.5)

  early_stopping:
    enabled: true
    patience: 16                  # Dừng training sau 16 epoch không cải thiện val_f1
    monitor: val_f1               # Chọn checkpoint theo macro F1 trên validation
    mode: max                     # F1 càng cao càng tốt
    min_delta: 0.0005             # Mức tăng F1 tối thiểu được tính là cải thiện
    restore_best_weights: true    # Tự động khôi phục weights tốt nhất khi dừng hoặc kết thúc

augmentation:
  horizontal_flip: 0.50
  rotation_degrees: 15
  brightness: 0.20
  contrast: 0.20
  saturation: 0.20
  hue: 0.05
  gaussian_noise_std: 0.00

checkpoint:
  best_path: checkpoints/best.pth
  last_path: checkpoints/last.pth

export:
  onnx_path: outputs/onnx/mobilenetv2_035_face_occlusion.onnx
  opset: 17
  dynamic_batch: true

evaluation:
  enabled: true
  split: val
  misclassified_dir: outputs/misclassified_val
  use_tta: false                  # Bật/tắt Test-Time Augmentation (2-pass Horizontal Flip) khi test/eval

inference:
  occluded_threshold: 0.4         # Dự đoán occluded khi sigmoid(logit) >= ngưỡng này
  use_tta: false                  # Tùy chọn TTA khi inference
